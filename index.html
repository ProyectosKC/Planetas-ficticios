  <script>
  // Stars
  (function() {
    const c = document.getElementById('stars');
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2 + 1;
      Object.assign(s.style, {
        width: size + 'px', height: size + 'px',
        left: Math.random() * 100 + '%', top: Math.random() * 100 + '%',
        '--dur': (Math.random() * 3 + 2) + 's'
      });
      c.appendChild(s);
    }
  })();

  let mostrarProceso = false;
  const CLAVE_CORRECTA = '284933788';

  function toggleProceso() {
    if (!mostrarProceso) {
      mostrarModalClave();
    } else {
      mostrarProceso = false;
      calcular();
    }
  }

  function mostrarModalClave() {
    const backdrop = document.createElement('div');
    backdrop.style.cssText = `
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7); display: flex; align-items: center;
      justify-content: center; z-index: 1000;
    `;

    const modal = document.createElement('div');
    modal.style.cssText = `
      background: #0d1a2d; border: 2px solid #7eb8e0; border-radius: 12px;
      padding: 24px; max-width: 400px; width: 90%; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    `;

    modal.innerHTML = `
      <h2 style="color: #7eb8e0; font-size: 20px; font-weight: 600; margin-bottom: 16px;">🔐 Acceso Restringido</h2>
      <p style="color: #a8c4d8; margin-bottom: 16px; font-size: 14px;">Ingresa la clave para ver el detalle del proceso:</p>
      <input type="password" id="clave-input" placeholder="Clave" style="
        width: 100%; padding: 10px 12px; background: #111f35; color: #e0eaf3;
        border: 1px solid #1e3a55; border-radius: 8px; margin-bottom: 16px;
        font-size: 14px; outline: none;
      " />
      <div style="display: flex; gap: 10px;">
        <button onclick="verificarClave()" style="
          flex: 1; padding: 10px; background: #1b6ca8; color: #e0eaf3;
          border: none; border-radius: 8px; cursor: pointer; font-weight: 500;
          transition: all 0.2s;
        " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
          Verificar
        </button>
        <button onclick="cerrarModal()" style="
          flex: 1; padding: 10px; background: #1e3a55; color: #a8c4d8;
          border: none; border-radius: 8px; cursor: pointer; font-weight: 500;
          transition: all 0.2s;
        " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
          Cancelar
        </button>
      </div>
      <div id="error-msg" style="color: #ff6b6b; font-size: 12px; margin-top: 12px; display: none;"></div>
    `;

    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);

    document.getElementById('clave-input').focus();
    document.getElementById('clave-input').onkeypress = (e) => {
      if (e.key === 'Enter') verificarClave();
    };

    window.modalBackdrop = backdrop;
  }

  function verificarClave() {
    const clave = document.getElementById('clave-input').value;
    if (clave === CLAVE_CORRECTA) {
      mostrarProceso = true;
      cerrarModal();
      calcular();
    } else {
      document.getElementById('error-msg').textContent = 'Clave incorrecta';
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('clave-input').value = '';
    }
  }

  function cerrarModal() {
    if (window.modalBackdrop) {
      window.modalBackdrop.remove();
      window.modalBackdrop = null;
    }
  }

  function formatScientific(num) {
    // Si el número es pequeño (entre -1000 y 1000), mostrar como decimal
    if (Math.abs(num) < 1000 && Math.abs(num) >= 0.001) {
      return num.toFixed(2).replace('.', ',');
    }
    // Si es muy pequeño o muy grande, usar notación científica
    const parts = num.toExponential(2).split('e');
    const mantissa = parseFloat(parts[0]);
    const exponent = parseInt(parts[1]);
    return `${mantissa.toString().replace('.', ',')}×10<sup>${exponent}</sup>`;
  }

  function formatWithSeparators(num) {
    // Convierte número a string con puntos para miles/millones
    const integerPart = Math.floor(num);
    return integerPart.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function calcular() {
    const x = Number(document.getElementById('numero').value);
    if (!x && x !== 0) return;

    // Constantes
    const G = 6.674e-11; // Constante gravitacional (m³ kg⁻¹ s⁻²)
    const masaSol = 1.99e30; // kg
    const masaTierra = 5.97e24; // kg
    const UA = 1.496e11; // metros

    // Cálculos orbitales
    const distUA = x * 1.5;
    const distM = distUA * UA;
    const masaPlaneta = x * masaTierra;

    // Fuerza gravitacional del Sol sobre el planeta
    const fuerzaGravitacional = (G * masaSol * masaPlaneta) / (distM * distM);

    // Periodo orbital en segundos (3ª ley de Kepler: T = 2π√(a³ / G×M☉), donde a = distancia/3)
    const a = distM / 3; // Semi-eje mayor (1/3 de la distancia orbital)
    const periodoSegundos = 2 * Math.PI * Math.sqrt((a * a * a) / (G * masaSol));
    const periodoAños = periodoSegundos / (365 * 24 * 3600);
    const periodoDias = periodoAños * 365;

    // Left column: Distancia orbital (UA y m) y Masa
    const leftRows = [
      { 
        icon: 'orbit', 
        label: 'Distancia Orbital (UA)', 
        value: `${formatScientific(distUA)} UA`, 
        formula: `d = X × 1.5`,
        reemplazo: `d = ${x} × 1.5`,
        resultado: `d = ${formatScientific(distUA)} UA`,
        delay: 0 
      },
      { 
        icon: 'arrow-right', 
        label: 'Distancia Orbital (m)', 
        value: `${formatScientific(distM)} m`, 
        formula: `d(m) = d(UA) × 1.496×10¹¹`,
        reemplazo: `d(m) = ${formatScientific(distUA)} × 1.496×10¹¹`,
        resultado: `d(m) = ${formatWithSeparators(Math.round(distM))} m`,
        delay: 0.05 
      },
      { 
        icon: 'weight', 
        label: 'Masa del Planeta', 
        value: `${formatScientific(masaPlaneta)} kg`, 
        formula: `M = X × M⊕`,
        reemplazo: `M = ${x} × 5.97×10²⁴ kg`,
        resultado: `M = ${formatWithSeparators(Math.round(masaPlaneta))} kg`,
        delay: 0.1 
      }
    ];

    // Right column: Fuerza gravitacional y Periodo orbital
    const rightRows = [
      { 
        icon: 'zap', 
        label: 'Fuerza Gravitacional', 
        value: `${formatScientific(fuerzaGravitacional)} N`, 
        formula: `F = (G × M☉ × M) / d²`,
        reemplazo: `F = (6.674×10⁻¹¹ × 1.99×10³⁰ × ${formatScientific(masaPlaneta)}) / (${formatScientific(distM)})²`,
        resultado: `F = ${formatWithSeparators(Math.round(fuerzaGravitacional))} N`,
        delay: 0 
      },
      { 
        icon: 'clock', 
        label: 'Período Orbital', 
        value: `${formatScientific(periodoSegundos)} s (${formatWithSeparators(Math.round(periodoDias))} días, ${formatScientific(periodoAños)} años)`, 
        formula: `T = 2π√(a³ / G×M☉) donde a = d/3`,
        reemplazo: `a = ${formatScientific(distM)}/3 = ${formatScientific(a)} m, T = 2π√((${formatScientific(a)})³ / (6.674×10⁻¹¹ × 1.99×10³⁰))`,
        resultado: `T = ${formatWithSeparators(Math.round(periodoSegundos))} s = ${formatWithSeparators(Math.round(periodoDias))} días = ${formatScientific(periodoAños)} años`,
        delay: 0.1 
      }
    ];

    const renderColumn = (rows) => rows.map(r => `
      <div class="result-row rounded-xl px-4 py-4 space-y-2" style="background: #111f35; animation-delay: ${r.delay}s;">
        <div class="flex items-center gap-3">
          <i data-lucide="${r.icon}" style="width:20px; height:20px; color: #1b6ca8; flex-shrink:0;"></i>
          <div class="text-left flex-1">
            <div class="text-xs font-medium opacity-50" style="color: #a8c4d8;">${r.label}</div>
            <div class="text-base font-semibold" style="color: #e0eaf3;">${r.value}</div>
          </div>
        </div>
        ${mostrarProceso ? `
          <div class="text-xs mt-2 p-3 rounded space-y-2" style="background: #0a1428; color: #a8c4d8; font-family: monospace; border-left: 3px solid #1b6ca8; padding-left: 10px;">
            <div style="color: #7eb8e0; font-weight: 600; margin-bottom: 6px;">📐 Fórmula:</div>
            <div style="word-break: break-all; margin-bottom: 8px;">${r.formula}</div>
            <div style="color: #7eb8e0; font-weight: 600; margin-bottom: 6px; margin-top: 8px;">🔢 Reemplazo:</div>
            <div style="word-break: break-all; margin-bottom: 8px;">${r.reemplazo}</div>
            <div style="color: #7eb8e0; font-weight: 600; margin-bottom: 6px; margin-top: 8px;">✅ Resultado:</div>
            <div style="word-break: break-all; color: #7eb8e0;">${r.resultado}</div>
          </div>
        ` : ''}
      </div>
    `).join('');

    const elLeft = document.getElementById('salida-left');
    const elRight = document.getElementById('salida-right');
    
    elLeft.innerHTML = `
      <div class="rounded-2xl p-5 space-y-3" style="background: #0d1a2d; border: 1px solid #1e3a55;">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-lg font-semibold" style="color: #7eb8e0;">✨ Órbita</h3>
        </div>
        ${renderColumn(leftRows)}
      </div>
    `;

    elRight.innerHTML = `
      <div class="rounded-2xl p-5 space-y-3" style="background: #0d1a2d; border: 1px solid #1e3a55;">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-lg font-semibold" style="color: #7eb8e0;">✨ Fuerzas</h3>
          <button onclick="toggleProceso()" class="text-xs px-3 py-1 rounded-lg transition-all" style="background: #1b6ca8; color: #e0eaf3; cursor: pointer; border: none; font-weight: 500;">
            ${mostrarProceso ? '📊 Ocultar' : '📊 Proceso'}
          </button>
        </div>
        ${renderColumn(rightRows)}
      </div>
    `;
    lucide.createIcons();
  }

  // SDK
  const defaultConfig = {
    main_title: '🌌 Calculadora de Planeta',
    instruction_text: 'Ingresa tu número de lista (X)',
    button_text: 'Calcular',
    background_color: '#070d1a',
    accent_color: '#7eb8e0',
    button_color: '#1b6ca8',
    text_color: '#e0eaf3',
    surface_color: '#0d1a2d',
    font_family: 'Outfit',
    font_size: 16
  };

  function applyConfig(config) {
    const c = key => config[key] || defaultConfig[key];
    document.getElementById('main-title').textContent = c('main_title');
    document.getElementById('main-title').style.color = c('accent_color');
    document.getElementById('instruction-text').textContent = c('instruction_text');
    document.getElementById('instruction-text').style.color = c('text_color');
    document.getElementById('btn-text').textContent = c('button_text');
    document.getElementById('app-wrapper').style.background = c('background_color');
    document.getElementById('calc-btn').style.background = c('button_color');
    document.getElementById('calc-btn').style.color = c('text_color');

    const baseSize = c('font_size');
    document.getElementById('main-title').style.fontSize = `${baseSize * 2}px`;
    document.getElementById('instruction-text').style.fontSize = `${baseSize}px`;

    const font = c('font_family');
    const stack = `${font}, sans-serif`;
    document.getElementById('main-title').style.fontFamily = stack;
    document.getElementById('instruction-text').style.fontFamily = stack;
  }

  if (window.elementSdk) {
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => applyConfig(config),
      mapToCapabilities: (config) => {
        const mut = (key) => ({
          get: () => config[key] || defaultConfig[key],
          set: (v) => { config[key] = v; window.elementSdk.setConfig({ [key]: v }); }
        });
        return {
          recolorables: [mut('background_color'), mut('surface_color'), mut('text_color'), mut('button_color'), mut('accent_color')],
          borderables: [],
          fontEditable: mut('font_family'),
          fontSizeable: mut('font_size')
        };
      },
      mapToEditPanelValues: (config) => new Map([
        ['main_title', config.main_title || defaultConfig.main_title],
        ['instruction_text', config.instruction_text || defaultConfig.instruction_text],
        ['button_text', config.button_text || defaultConfig.button_text]
      ])
    });
  }

  lucide.createIcons();
</script>
 </body>
</html>
